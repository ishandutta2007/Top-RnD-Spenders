<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="200" viewBox="0 0 800 200"><defs><linearGradient id="bg" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="100%" stop-color="#1e293b"/></linearGradient><linearGradient id="text-gradient" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="bar-gradient" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#3b82f6"/></linearGradient><style>@keyframes grow{0%{transform:scaleY(.2);opacity:.5}}@keyframes float{0%{transform:translateY(0)}50%{transform:translateY(-10px)}}.subtitle,.title{font-family:&apos;Inter&apos;,-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title{font-size:42px;font-weight:800;fill:url(#text-gradient)}.subtitle{font-size:16px;font-weight:500;fill:#94a3b8}.bar{fill:url(#bar-gradient);transform-origin:bottom;animation:grow 2s ease-in-out infinite alternate}.bar1{animation-delay:0s}.bar2{animation-delay:.2s}.bar3{animation-delay:.4s}.bar4{animation-delay:.6s}.bar5{animation-delay:.8s}.bar6{animation-delay:1s}.bar7{animation-delay:1.2s}.dot{fill:#c084fc;animation:float 3s ease-in-out infinite}</style></defs><rect width="800" height="200" fill="url(#bg)" rx="16"/><circle cx="150" cy="50" r="4" class="dot" style="animation-delay:0s"/><circle cx="650" cy="150" r="3" class="dot" style="animation-delay:1s"/><circle cx="700" cy="40" r="5" class="dot" style="animation-delay:2s"/><circle cx="50" cy="160" r="4" class="dot" style="animation-delay:.5s"/><g transform="translate(550, 150)"><rect width="16" height="80" x="0" y="-80" class="bar bar1" rx="4"/><rect width="16" height="60" x="24" y="-60" class="bar bar2" rx="4"/><rect width="16" height="100" x="48" y="-100" class="bar bar3" rx="4"/><rect width="16" height="40" x="72" y="-40" class="bar bar4" rx="4"/><rect width="16" height="120" x="96" y="-120" class="bar bar5" rx="4"/><rect width="16" height="70" x="120" y="-70" class="bar bar6" rx="4"/><rect width="16" height="90" x="144" y="-90" class="bar bar7" rx="4"/></g><text x="50" y="90" class="title">Top R&amp;D Spenders</text><text x="50" y="125" class="subtitle">Tracking the flow of global innovation capital</text></svg>